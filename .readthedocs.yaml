# Read the Docs configuration (v2).
# Build the installed ROOT Explorer package and the Sphinx user guides.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/source/conf.py
  fail_on_warning: true

python:
  install:
    - method: uv
      command: sync
      groups:
        - docs
