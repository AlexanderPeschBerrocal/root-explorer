[build-system]
requires = ["setuptools>=65.5", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "root-explorer"
version = "0.1.0"
description = "A Streamlit app for interactive inspection and plotting of HEP ROOT TTrees."
authors = [
  { name = "Alexander Pesch Berrocal", email = "alexander.pesch.berrocal@rwth-aachen.de" },
  { name = "Jan Lukas Späh", email = "janlukas.spaeh@physik.rwth-aachen.de" }
]
readme = "README.md"
requires-python = ">=3.10"
keywords = ["ROOT", "HEP", "TTrees", "Streamlit"]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "awkward",
    "matplotlib",
    "numpy",
    "pandas",
    "plotly",
    "streamlit~=1.62.0",
    "uproot",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-cov",
]
dev = [
    "build==1.6.0",
    "bump-my-version>=1.2",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "ruff==0.16.5",
]
docs = [
    "myst-parser",
    "sphinx>=7",
    "sphinx-autodoc-typehints",
    "sphinx-autoapi",
    "sphinx-rtd-theme",
]

[project.urls]
Homepage = "https://github.com/AlexanderPeschBerrocal/root-explorer"
Issues = "https://github.com/AlexanderPeschBerrocal/root-explorer/issues"
Source = "https://github.com/AlexanderPeschBerrocal/root-explorer"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
required-version = "==0.16.5"
line-length = 100

[tool.ruff.lint]
select = [
    "E4",    # pycodestyle: imports
    "E7",    # pycodestyle: statements
    "E9",    # pycodestyle: runtime/syntax errors
    "F",     # Pyflakes: unused imports, undefined names, ...
    "I",     # isort
    "UP",    # pyupgrade: automatically update older python code to use modern syntax for newer versions
    "B",     # flake8-bugbear: catches likely bugs and design problems
    "SIM",   # flake8-simplify: simplifies code
    "C4",    # flake8-comprehensions: detects unnecessary list/set/dict comprehensions
    "PIE",   # flake8-pie: Miscellaneous rules for code quality and maintainability
    "RUF",   # Ruff-specific rules: Ruff own rules for code quality (suspicious code, complexity, etc.)
    "NPY",   # NumPy-specific rules: enforces best practices for NumPy code
    "PERF",  # Perflint: minor performance optimizations
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
