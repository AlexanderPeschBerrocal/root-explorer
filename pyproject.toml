[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "root-explorer"
version = "2026.9.2"
description = "A Streamlit app for interactive inspection and plotting of HEP ROOT TTrees and RNTuples."
authors = [
  { name = "Alexander Pesch Berrocal", email = "alexander.pesch.berrocal@rwth-aachen.de" },
  { name = "Jan Lukas Späh", email = "janlukas.spaeh@physik.rwth-aachen.de" }
]
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.12,<3.13"
keywords = ["ROOT", "HEP", "TTrees", "RNTuples", "Streamlit"]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "awkward",
    "hist",
    "matplotlib",
    "numpy",
    "pandas",
    "plotly",
    "scipy",
    "streamlit~=1.62.0",
    "uproot>=5.7.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-cov",
]
dev = [
    "build==1.6.0",
    "bump-my-version==1.5.1",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "ruff==0.16.5",
    "watchdog",
]
docs = [
    "myst-parser",
    "sphinx>=7",
    "sphinx-autodoc-typehints",
    "sphinx-autoapi",
    "sphinx-rtd-theme",
]

[project.urls]
Homepage = "https://github.com/AlexanderPeschBerrocal/root-explorer"
Issues = "https://github.com/AlexanderPeschBerrocal/root-explorer/issues"
Source = "https://github.com/AlexanderPeschBerrocal/root-explorer"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
root_explorer = ["assets/*.png"]

[tool.mypy]
python_version = "3.12"
files = [
    "src/root_explorer/models.py",
    "src/root_explorer/analysis/arrays.py",
    "src/root_explorer/analysis/variables.py",
    "src/root_explorer/geometry/gdml.py",
]
disallow_untyped_defs = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["awkward.*", "uproot.*"]
ignore_missing_imports = true

[tool.ruff]
required-version = "==0.16.5"
line-length = 100

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "C4",
    "PIE",
    "RUF",
    "NPY",
    "PERF",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.bumpversion]
parse = """(?x)
    (?P<release>
        (?:[1-9][0-9]{3})\.
        (?:1[0-2]|[1-9])
    )
    \.(?P<patch>\d+)
"""
serialize = ["{release}.{patch}"]

commit = true
tag = true
tag_name = "v{new_version}"
message = "Release: {new_version}"

[tool.bumpversion.parts.release]
calver_format = "{YYYY}.{MM}"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'
