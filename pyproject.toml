[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "root-explorer"
version = "2026.10.1"
description = "A Streamlit app for interactive inspection and plotting of HEP ROOT TTrees and RNTuples."
authors = [
  { name = "Alexander Pesch Berrocal", email = "alexander.pesch.berrocal@rwth-aachen.de" },
  { name = "Jan Lukas Späh", email = "janlukas.spaeh@physik.rwth-aachen.de" }
]
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.12,<3.13"
keywords = ["ROOT", "HEP", "TTrees", "RNTuples", "Streamlit"]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "awkward",
    "hist",
    "matplotlib",
    "numpy",
    "pandas",
    "plotly",
    "scipy",
    "streamlit~=1.62.0",
    "uproot>=5.7.0",
]

[project.optional-dependencies]
test = [
    "hypothesis",
    "pytest>=8",
    "pytest-cov",
]
dev = [
    "build==1.6.0",
    "bump-my-version==1.5.1",
    "mypy>=1.11",
    "pandas-stubs",
    "pre-commit>=3.8",
    "ruff==0.16.5",
    "scipy-stubs",
    "watchdog",
]
docs = [
    "myst-parser",
    "sphinx>=7",
    "furo",
]
screenshots = [
    "playwright>=1.55,<2",
]

[project.scripts]
root-explorer = "root_explorer.cli:main"

[project.urls]
Homepage = "https://github.com/AlexanderPeschBerrocal/root-explorer"
Issues = "https://github.com/AlexanderPeschBerrocal/root-explorer/issues"
Source = "https://github.com/AlexanderPeschBerrocal/root-explorer"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
root_explorer = ["assets/*.png"]

[tool.mypy]
python_version = "3.12"
files = ["src/root_explorer"]
disallow_untyped_defs = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["awkward.*", "uproot.*"]
ignore_missing_imports = true

# Plotly ships neither inline types nor maintained stubs.
[[tool.mypy.overrides]]
module = ["plotly.*"]
ignore_missing_imports = true

[tool.ruff]
required-version = "==0.16.5"
line-length = 100

[tool.ruff.lint]
select = [
    "E4",    # pycodestyle: imports
    "E7",    # pycodestyle: statements
    "E9",    # pycodestyle: runtime/syntax errors
    "F",     # Pyflakes: unused imports, undefined names, ...
    "I",     # isort
    "UP",    # pyupgrade: automatically update older python code to use modern syntax for newer versions
    "B",     # flake8-bugbear: catches likely bugs and design problems
    "SIM",   # flake8-simplify: simplifies code
    "C4",    # flake8-comprehensions: detects unnecessary list/set/dict comprehensions
    "PIE",   # flake8-pie: Miscellaneous rules for code quality and maintainability
    "RUF",   # Ruff-specific rules: Ruff own rules for code quality (suspicious code, complexity, etc.)
    "NPY",   # NumPy-specific rules: enforces best practices for NumPy code
    "PERF",  # Perflint: minor performance optimizations
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.bumpversion]
parse = """(?x)
    (?P<release>
        (?:[1-9][0-9]{3})\\.
        (?:1[0-2]|[1-9])
    )
    \\.(?P<patch>\\d+)
"""
serialize = ["{release}.{patch}"]

commit = true
tag = true
tag_name = "v{new_version}"
message = "Release: {new_version}"

[tool.bumpversion.parts.release]
calver_format = "{YYYY}.{MM}"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'
