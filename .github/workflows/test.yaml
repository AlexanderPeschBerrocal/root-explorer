name: test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Python 3.12 (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # minimum: the requires-python floor; shipped: .python-version, the
        # interpreter in the Docker image.
        python: [minimum, shipped]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Select the ${{ matrix.python }} interpreter
        env:
          SELECTION: ${{ matrix.python }}
        run: |
          python3 - <<'PY' >> "${GITHUB_ENV}"
          import os
          import re
          import tomllib
          from pathlib import Path

          if os.environ["SELECTION"] == "minimum":
              spec = tomllib.loads(Path("pyproject.toml").read_text())["project"]["requires-python"]
              match = re.search(r">=\s*(\d+\.\d+\.\d+)", spec)
              assert match, f"requires-python needs an explicit x.y.z floor: {spec}"
              version = match.group(1)
          else:
              version = Path(".python-version").read_text().strip()
          print(f"UV_PYTHON={version}")
          PY

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
          enable-cache: true
      - name: Install locked test environment
        run: uv sync --locked --no-default-groups --group test

      - name: Check the selected interpreter is used
        run: |
          actual=$(.venv/bin/python -c "import platform; print(platform.python_version())")
          echo "selected: ${UV_PYTHON}, environment: ${actual}"
          test "${UV_PYTHON}" = "${actual}"

      - name: Run test suite
        run: MPLBACKEND=Agg uv run --no-sync pytest -q --cov=root_explorer --cov-report=term-missing
