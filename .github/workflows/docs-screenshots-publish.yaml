name: Publish reviewed documentation screenshots

# Available from the Actions UI once this workflow exists on the default branch.
# Deliberately separate from the read-only screenshot generation workflow.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Successful Documentation screenshots run ID to publish"
        required: true
        type: string
      target_branch:
        description: "Existing review branch receiving the images (not main)"
        required: true
        default: "docs/74-readthedocs"
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: docs-screenshot-publish-${{ inputs.target_branch }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify screenshot run and target branch
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::Run ID must be numeric"; exit 1; }
          git check-ref-format --branch "$TARGET_BRANCH"
          case "$TARGET_BRANCH" in main|master) echo "::error::Publish to a review branch, not the default branch"; exit 1;; esac
          git fetch origin "refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > "$RUNNER_TEMP/source-run.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          data = json.loads((Path(os.environ["RUNNER_TEMP"]) / "source-run.json").read_text())
          assert data["name"] == "Documentation screenshots", "Source is not screenshot CI"
          assert data["status"] == "completed" and data["conclusion"] == "success", "Source run was not successful"
          assert data["repository"]["full_name"] == os.environ["GITHUB_REPOSITORY"], "Run belongs to another repository"
          assert data["head_branch"] == os.environ["TARGET_BRANCH"], "Run came from a different branch"
          assert data["event"] in {"pull_request", "workflow_dispatch"}, "Unexpected source event"
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"SOURCE_SHA={data['head_sha']}\n")
          PY
          git merge-base --is-ancestor "$SOURCE_SHA" "refs/remotes/origin/$TARGET_BRANCH" || {
            echo "::error::The screenshot run SHA is not part of the selected branch"; exit 1;
          }
      - name: Download and verify the five screenshots
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/screenshots"
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name root-explorer-screenshots --dir "$RUNNER_TEMP/screenshots"
          python - <<'PY'
          import os
          import struct
          from pathlib import Path

          folder = Path(os.environ["RUNNER_TEMP"]) / "screenshots"
          expected = {
              "overview.png", "histogram-fit.png", "plot-2d.png",
              "object-browser.png", "event-inspection.png",
          }
          found = list(folder.rglob("*"))
          actual = {p.name for p in found if p.is_file()}
          assert actual == expected, f"Unexpected or missing image files: {actual ^ expected}"
          for name in expected:
              matches = list(folder.rglob(name))
              assert len(matches) == 1, f"Expected one {name}"
              data = matches[0].read_bytes()
              assert len(data) > 16000 and data[:8] == b"\x89PNG\r\n\x1a\n", f"Invalid PNG: {name}"
              assert data[12:16] == b"IHDR", f"Missing PNG header: {name}"
              width, height = struct.unpack(">II", data[16:24])
              assert width >= 1200 and height >= 700, f"Unexpected dimensions: {name}"
              print(f"Validated {name}: {width} x {height}")
          PY
      - name: Commit screenshot replacements to review branch
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
          RUN_ID: ${{ inputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          git switch --detach "refs/remotes/origin/$TARGET_BRANCH"
          for name in overview histogram-fit plot-2d object-browser event-inspection; do
            source="$(find "$RUNNER_TEMP/screenshots" -name "$name.png" -type f -print -quit)"
            install -m 644 "$source" "docs/source/_static/screenshots/$name.png"
          done
          git add docs/source/_static/screenshots/{overview,histogram-fit,plot-2d,object-browser,event-inspection}.png
          if git diff --cached --quiet; then
            echo "Screenshots already match the reviewed CI artefact."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: publish reviewed screenshots from run $RUN_ID (#74)"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
