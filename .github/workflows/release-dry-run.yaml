# .github/workflows/release-dry-run.yaml
#
# Dry-runs scripts/release.py in a throwaway clone without push access. Pull
# requests that touch the release inputs check both version parts; the manual
# Release workflow calls this workflow for the part it is about to publish.

name: Release dry run

on:
  pull_request:
    branches: [main]
    paths:
      - pyproject.toml
      - uv.lock
      - scripts/release.py
      - scripts/check_release.py
      - .github/workflows/release-dry-run.yaml
  workflow_call:
    inputs:
      part:
        description: "Version part to dry-run: patch or release"
        type: string
        required: true

permissions:
  contents: read

jobs:
  dry-run:
    name: Dry run (${{ matrix.part }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(inputs.part && format('["{0}"]', inputs.part) || '["patch", "release"]') }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Tags are needed to refuse versions that were already released.
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
          enable-cache: true

      - name: Release in a throwaway clone without push access
        env:
          PART: ${{ matrix.part }}
          REQUESTED: ${{ inputs.part }}
        run: |
          clone="${RUNNER_TEMP}/release-dry-run"
          git clone --quiet --no-local --no-checkout "${GITHUB_WORKSPACE}" "${clone}"
          cd "${clone}"
          git remote remove origin
          git switch --quiet -C main "$(git -C "${GITHUB_WORKSPACE}" rev-parse HEAD)"
          git config user.name "Release dry run"
          git config user.email "release-dry-run@example.invalid"
          uv sync --locked --no-default-groups --group release

          current=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [[ -z "${REQUESTED}" && "${PART}" == release && "${current%.*}" == "$(date -u +%Y.%-m)" ]]; then
            # This month already has a release: the helper must refuse a
            # "release" bump without leaving a commit, tag or modified file.
            start=$(git rev-parse HEAD)
            if uv run --no-sync python scripts/release.py release; then
              echo "release.py accepted a second calendar release in the same month"
              exit 1
            fi
            test "$(git rev-parse HEAD)" = "${start}"
            test -z "$(git status --porcelain)"
            test -z "$(git tag --points-at HEAD)"
            echo "release.py correctly refused a second calendar release for ${current%.*}"
          else
            uv run --no-sync python scripts/release.py "${PART}"
            uv run --no-sync python scripts/check_release.py
          fi
