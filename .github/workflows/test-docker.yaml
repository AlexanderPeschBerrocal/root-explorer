# .github/workflows/test-docker.yaml

name: Docker

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20

    strategy:
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            suffix: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: root-explorer:ci-${{ matrix.suffix }}
          cache-from: type=gha,scope=docker-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.suffix }}

      - name: Start container
        run: |
          docker run \
            --detach \
            --platform "${{ matrix.platform }}" \
            --name root-explorer-ci \
            --publish 8501:8501 \
            root-explorer:ci-${{ matrix.suffix }}

      - name: Check application health
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health > /dev/null; then
              echo "root-explorer is healthy on ${{ matrix.platform }}"
              exit 0
            fi
            sleep 1
          done

          echo "root-explorer did not become healthy"
          docker logs root-explorer-ci
          exit 1

      - name: Check application version
        run: |
          expected=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          actual=$(docker exec root-explorer-ci python -c "import root_explorer; print(root_explorer.__version__)")
          echo "pyproject.toml: ${expected}, container: ${actual}"
          test "${expected}" = "${actual}"

      - name: Check container Python matches the CI interpreter
        # CI installs the interpreter named in .python-version; it must be the
        # one shipped in the image, so base-image updates must also update it.
        run: |
          expected=$(cat .python-version)
          actual=$(docker exec root-explorer-ci python -c "import platform; print(platform.python_version())")
          echo ".python-version: ${expected}, container: ${actual}"
          test "${expected}" = "${actual}"

      - name: Check scientific runtime versions against committed lock
        run: |
          python3 - <<'PY'
          import subprocess
          import tomllib
          from pathlib import Path
          from importlib.metadata import PackageNotFoundError

          lock = tomllib.loads(Path("uv.lock").read_text())
          packages = lock["package"]
          for package in (
              "numpy", "scipy", "awkward", "uproot", "matplotlib",
              "pandas", "plotly", "hist", "streamlit",
          ):
              candidates = {p["version"] for p in packages if p["name"] == package}
              assert len(candidates) == 1, f"Expected unique locked {package}, got {candidates}"
              expected = candidates.pop()
              actual = subprocess.check_output(
                  [
                      "docker", "exec", "root-explorer-ci",
                      "python", "-c",
                      "from importlib.metadata import version; "
                      f"print(version({package!r}))",
                  ],
                  text=True,
              ).strip()
              print(f"{package}: locked={expected}, installed={actual}")
              assert actual == expected, f"{package}: runtime differs from lock"
          PY

      - name: Stop container
        if: always()
        run: docker rm --force root-explorer-ci || true
