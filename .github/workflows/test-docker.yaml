# .github/workflows/test-docker.yaml

name: Docker

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20

    strategy:
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            suffix: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: root-explorer:ci-${{ matrix.suffix }}
          cache-from: type=gha,scope=docker-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.suffix }}

      - name: Start container
        run: |
          docker run \
            --detach \
            --platform "${{ matrix.platform }}" \
            --name root-explorer-ci \
            --publish 8501:8501 \
            root-explorer:ci-${{ matrix.suffix }}

      - name: Check application health
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health > /dev/null; then
              echo "root-explorer is healthy on ${{ matrix.platform }}"
              exit 0
            fi
            sleep 1
          done

          echo "root-explorer did not become healthy"
          docker logs root-explorer-ci
          exit 1

      - name: Check application version
        run: |
          expected=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          actual=$(docker exec root-explorer-ci python -c "import root_explorer; print(root_explorer.__version__)")
          echo "pyproject.toml: ${expected}, container: ${actual}"
          test "${expected}" = "${actual}"

      - name: Check container Python matches the CI interpreter
        # CI installs the interpreter named in .python-version; it must be the
        # one shipped in the image, so base-image updates must also update it.
        run: |
          expected=$(cat .python-version)
          actual=$(docker exec root-explorer-ci python -c "import platform; print(platform.python_version())")
          echo ".python-version: ${expected}, container: ${actual}"
          test "${expected}" = "${actual}"

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"

      - name: Check the complete runtime environment against the committed lock
        # Every locked runtime package that applies to this platform must be
        # installed at its locked version, and nothing else may be installed.
        # Markers are evaluated inside the container, for its own platform.
        run: |
          uv export --locked --no-default-groups --no-emit-project --no-hashes \
            --no-header --no-annotate --format requirements-txt \
            --output-file "${RUNNER_TEMP}/locked.txt" > /dev/null
          docker cp "${RUNNER_TEMP}/locked.txt" root-explorer-ci:/tmp/locked.txt
          docker exec -i root-explorer-ci python - /tmp/locked.txt <<'PY'
          import sys
          from importlib.metadata import distributions

          from packaging.requirements import Requirement
          from packaging.utils import canonicalize_name
          from packaging.version import Version

          expected = {}
          with open(sys.argv[1]) as file:
              for line in filter(None, map(str.strip, file)):
                  requirement = Requirement(line)
                  if requirement.marker is None or requirement.marker.evaluate():
                      (spec,) = requirement.specifier
                      expected[canonicalize_name(requirement.name)] = spec.version
          installed = {canonicalize_name(d.metadata["Name"]): d.version for d in distributions()}
          # The application's own version is checked against pyproject.toml above.
          installed.pop("root-explorer")

          problems = [
              *(f"missing: {name}=={expected[name]}" for name in expected.keys() - installed.keys()),
              *(f"not locked: {name}=={installed[name]}" for name in installed.keys() - expected.keys()),
              *(
                  f"{name}: locked {expected[name]}, installed {installed[name]}"
                  for name in expected.keys() & installed.keys()
                  if Version(expected[name]) != Version(installed[name])
              ),
          ]
          print(f"{len(installed)} installed distributions, {len(expected)} locked for this platform")
          if problems:
              sys.exit("Runtime environment differs from uv.lock:\n" + "\n".join(sorted(problems)))
          PY

      - name: Stop container
        if: always()
        run: docker rm --force root-explorer-ci || true
