# .github/workflows/test-docker.yaml

name: Docker

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20

    strategy:
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            suffix: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: root-explorer:ci-${{ matrix.suffix }}
          cache-from: type=gha,scope=docker-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.suffix }}

      - name: Start container
        run: |
          docker run \
            --detach \
            --platform "${{ matrix.platform }}" \
            --name root-explorer-ci \
            --publish 8501:8501 \
            root-explorer:ci-${{ matrix.suffix }}

      - name: Check application health
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health > /dev/null; then
              echo "root-explorer is healthy on ${{ matrix.platform }}"
              exit 0
            fi
            sleep 1
          done

          echo "root-explorer did not become healthy"
          docker logs root-explorer-ci
          exit 1

      - name: Stop container
        if: always()
        run: docker rm --force root-explorer-ci || true
