name: Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.6"
          enable-cache: true
      - name: Ensure every uv pin matches the Docker image
        # Dependabot does not update setup-uv's version input or the Read the
        # Docs install, so check them against the uv image in the Dockerfile.
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          expected = re.search(
              r"^COPY --from=ghcr\.io/astral-sh/uv:(\S+) ", Path("Dockerfile").read_text(), re.M
          ).group(1)
          found = {}
          for workflow in sorted(Path(".github/workflows").glob("*.yaml")):
              for step in re.split(r"\n\s*- ", workflow.read_text()):
                  if re.search(r"^\s*uses: astral-sh/setup-uv@", step, re.M):
                      match = re.search(r'^\s*version: "([^"]+)"', step, re.M)
                      found.setdefault(workflow.name, []).append(match and match.group(1))
          found[".readthedocs.yaml"] = re.findall(
              r"asdf (?:install|global) uv (\S+)", Path(".readthedocs.yaml").read_text()
          )
          print(f"Dockerfile: {expected}", *(f"{name}: {pins}" for name, pins in found.items()))
          assert all(pins and set(pins) == {expected} for pins in found.values()), (
              "Every setup-uv step and Read the Docs must use the Dockerfile's uv version"
          )
          PY
      - name: Validate universal lockfile
        run: uv lock --check
      - name: Build package
        run: uv build
      - name: Install wheel against unlocked metadata in an isolated environment
        run: |
          uv venv /tmp/root-explorer-wheel
          uv pip install --python /tmp/root-explorer-wheel/bin/python dist/*.whl
          uv pip check --python /tmp/root-explorer-wheel/bin/python
      - name: Verify installed wheel and CLI from outside the checkout
        run: |
          cd /tmp
          /tmp/root-explorer-wheel/bin/python - <<'PY'
          import tomllib
          from importlib.metadata import version
          import root_explorer

          with open(__import__("os").environ["GITHUB_WORKSPACE"] + "/pyproject.toml", "rb") as file:
              expected = tomllib.load(file)["project"]["version"]
          assert root_explorer.__version__ == version("root-explorer") == expected
          PY
          /tmp/root-explorer-wheel/bin/root-explorer --version
