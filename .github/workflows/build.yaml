# .github/workflows/build.yaml

name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build frontend
        run: python -m pip install "build==1.6.0"

      - name: Build package
        run: python -m build

      - name: Install built wheel
        run: python -m pip install dist/*.whl

      - name: Check installed dependencies
        run: python -m pip check

      - name: Check installed package version
        # Compare the authoritative [project].version with the installed wheel metadata
        # and the runtime version, not only two reads of the same metadata.
        run: |
          python - <<'PY'
          import tomllib
          from importlib.metadata import version

          import root_explorer

          declared = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          installed = version("root-explorer")
          runtime = root_explorer.__version__
          print(f"pyproject.toml: {declared}, installed: {installed}, runtime: {runtime}")
          assert declared == installed == runtime, "Version sources disagree."
          PY