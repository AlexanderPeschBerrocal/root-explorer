# .github/workflows/publish-docker.yaml

name: Publish Docker image

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate release tag and package version
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[1-9][0-9]{3}\.([1-9]|1[0-2])\.[0-9]+$ ]]; then
            echo "Invalid release tag: ${GITHUB_REF_NAME}"
            echo "Expected CalVer tag of the form vYYYY.M.N, for example v2026.9.1"
            exit 1
          fi

          TAG_VERSION="${GITHUB_REF_NAME#v}"

          PROJECT_VERSION="$(
            python - <<'PY'
          import tomllib

          with open("pyproject.toml", "rb") as file:
              project = tomllib.load(file)

          print(project["project"]["version"])
          PY
          )"

          echo "Tag version:     ${TAG_VERSION}"
          echo "Project version: ${PROJECT_VERSION}"

          if [[ "${TAG_VERSION}" != "${PROJECT_VERSION}" ]]; then
            echo "Tag version does not match pyproject.toml."
            exit 1
          fi

      - name: Verify release commit is on main
        shell: bash
        run: |
          git fetch origin main:refs/remotes/origin/main --no-tags

          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Release tag ${GITHUB_REF_NAME} does not point to a commit contained in main."
            exit 1
          fi

  build:
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20

    strategy:
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            suffix: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=stable

      - name: Resolve image name
        id: image
        shell: bash
        run: |
          first_tag="$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | head -n 1)"
          echo "name=${first_tag%:*}" >> "${GITHUB_OUTPUT}"

      - name: Build and push Docker image by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=publish-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=publish-${{ matrix.suffix }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true

      - name: Export image digest
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"

      - name: Upload image digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.suffix }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Download image digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=stable

      - name: Create multi-platform image
        shell: bash
        run: |
          mapfile -t digests < <(
            find "${RUNNER_TEMP}/digests" -maxdepth 1 -type f -printf '%f\n' | sort
          )

          if [[ "${#digests[@]}" -ne 2 ]]; then
            echo "Expected two platform digests, found ${#digests[@]}."
            exit 1
          fi

          first_tag="$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | head -n 1)"
          image_name="${first_tag%:*}"

          sources=()
          for digest in "${digests[@]}"; do
            sources+=("${image_name}@sha256:${digest}")
          done

          tag_args=()
          while IFS= read -r tag; do
            if [[ -n "${tag}" ]]; then
              tag_args+=("--tag" "${tag}")
            fi
          done <<< "${{ steps.meta.outputs.tags }}"

          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"

      - name: Verify multi-platform image
        shell: bash
        run: |
          docker buildx imagetools inspect \
            "ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
