name: Ruff

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.6"
          enable-cache: true
      - name: Install locked lint environment
        run: uv sync --locked --no-default-groups --group lint

      - name: Check formatting
        run: uv run --no-sync ruff format --check .

      - name: Run lint checks
        run: uv run --no-sync ruff check --output-format=github .