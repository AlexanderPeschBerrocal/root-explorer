name: Documentation screenshots

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "src/root_explorer/app/**"
      - "docs/scripts/**"
      - ".github/workflows/docs-screenshots.yaml"
      - "pyproject.toml"
      - "docs/source/_static/screenshots/**"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install screenshot tooling
        run: |
          python -m pip install -e ".[screenshots]"
          python -m playwright install --with-deps chromium
      - name: Generate screenshots from synthetic data
        run: python docs/scripts/generate_screenshots.py --output-dir docs/_build/screenshots --theme both
      - name: Upload screenshots for human review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: root-explorer-screenshots
          path: |
            docs/_build/screenshots/*.png
          if-no-files-found: warn

