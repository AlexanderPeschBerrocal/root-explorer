name: Documentation screenshots

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "src/root_explorer/app/**"
      - "docs/scripts/**"
      - ".github/workflows/docs-screenshots.yaml"
      - "pyproject.toml"
      - "docs/source/_static/screenshots/**"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Install screenshot tooling
        run: |
          uv sync --locked --no-default-groups --group screenshots
          uv run --no-sync playwright install --with-deps chromium
      - name: Generate screenshots from synthetic data
        run: uv run --no-sync python docs/scripts/generate_screenshots.py --output-dir docs/_build/screenshots --theme both
      - name: Upload screenshots for human review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: root-explorer-screenshots
          path: |
            docs/_build/screenshots/*.png
          if-no-files-found: warn

