name: Documentation screenshots

on:
  workflow_dispatch:
  push:
    branches: [docs/74-readthedocs]
    paths:
      - "docs/scripts/**"
      - ".github/workflows/docs-screenshots.yaml"
      - "pyproject.toml"
  pull_request:
    branches: [main]
    paths:
      - "src/root_explorer/app/**"
      - "docs/scripts/**"
      - ".github/workflows/docs-screenshots.yaml"
      - "pyproject.toml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install screenshot tooling
        run: |
          python -m pip install -e ".[screenshots]"
          python -m playwright install --with-deps chromium
      - name: Generate screenshots from synthetic data
        run: python docs/scripts/generate_screenshots.py --output-dir docs/source/_static/screenshots
      - name: Upload screenshots for human review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: root-explorer-screenshots
          path: |
            docs/source/_static/screenshots/*.png
          if-no-files-found: warn

      - name: Commit reviewed branch screenshot baseline
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/docs/74-readthedocs' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/source/_static/screenshots/overview.png docs/source/_static/screenshots/histogram-fit.png docs/source/_static/screenshots/plot-2d.png docs/source/_static/screenshots/object-browser.png docs/source/_static/screenshots/event-inspection.png
          if ! git diff --cached --quiet; then
            git commit -m "docs: capture generated ROOT Explorer screenshots (#74)"
            git push origin HEAD:docs/74-readthedocs
          fi
