name: Documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install locked documentation environment
        run: uv sync --locked --no-default-groups --group docs
      - name: Build documentation (nitpicky, warnings as errors)
        run: uv run --no-sync python -m sphinx -n -W --keep-going -b html docs/source docs/_build/html
