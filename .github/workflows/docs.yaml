name: Documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
          enable-cache: true
      - name: Install locked documentation environment
        run: uv sync --locked --no-default-groups --group docs
      - name: Build documentation (nitpicky, warnings as errors)
        run: uv run --no-sync python -m sphinx -n -W --keep-going -b html docs/source docs/_build/html
