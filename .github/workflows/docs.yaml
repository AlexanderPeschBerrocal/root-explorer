name: Documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install project and documentation dependencies
        run: python -m pip install -e ".[docs]"
      - name: Build documentation (nitpicky, warnings as errors)
        run: python -m sphinx -n -W --keep-going -b html docs/source docs/_build/html
