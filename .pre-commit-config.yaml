repos:
  # Run the Ruff version locked in uv.lock, so Dependabot updates a single pin.
  # --no-sync never rebuilds the project environment from inside a git hook.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --no-sync ruff check --force-exclude --fix
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: uv run --no-sync ruff format --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
